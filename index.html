<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#D97706" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="MealMate" />
<title>MealMate — Bachelor Meal Prep</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/png" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="preload" href="./fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="./fonts/manrope.woff2" as="font" type="font/woff2" crossorigin />
<style>
  @font-face {
    font-family: 'Fraunces';
    src: url('./fonts/fraunces.woff2') format('woff2-variations');
    font-weight: 400 900;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Manrope';
    src: url('./fonts/manrope.woff2') format('woff2-variations');
    font-weight: 200 800;
    font-style: normal;
    font-display: swap;
  }
</style>
<style>
  /* ---------- design tokens ---------- */
  :root {
    --cream: #FAF4E8;
    --cream-2: #F3EAD3;
    --paper: #FFFBF2;
    --ink: #1A1612;
    --ink-2: #4A3F33;
    --ink-3: #8A7A66;
    --line: #E5DBC4;
    --turmeric: #D97706;
    --turmeric-deep: #B45309;
    --paprika: #C2410C;
    --coriander: #65803F;
    --coriander-deep: #4A6529;
    --cardamom: #5C8784;
    --danger: #B91C1C;
    --shadow-sm: 0 1px 2px rgba(26,22,18,0.06);
    --shadow-md: 0 4px 16px rgba(26,22,18,0.08);
    --shadow-lg: 0 12px 32px rgba(26,22,18,0.12);
    --radius: 14px;
    --radius-sm: 10px;
    --radius-lg: 22px;
    --tabbar-h: calc(64px + env(safe-area-inset-bottom));
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior-y: contain; }
  body {
    font-family: 'Manrope', system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--cream);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    background-image:
      radial-gradient(rgba(180,83,9,0.03) 1px, transparent 1px),
      radial-gradient(rgba(101,128,63,0.02) 1px, transparent 1px);
    background-size: 24px 24px, 32px 32px;
    background-position: 0 0, 12px 12px;
  }

  h1, h2, h3, h4, h5 {
    font-family: 'Fraunces', 'Georgia', serif;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin: 0;
  }
  h1 { font-size: 28px; font-variation-settings: 'opsz' 96; letter-spacing: -0.02em; }
  h2 { font-size: 22px; font-variation-settings: 'opsz' 48; }
  h3 { font-size: 17px; font-variation-settings: 'opsz' 24; font-weight: 600; }
  h5 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-3); font-weight: 700; font-family: 'Manrope', sans-serif; }

  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; padding: 0; }

  #app {
    min-height: 100vh;
    padding-bottom: calc(var(--tabbar-h) + 12px);
    padding-top: env(safe-area-inset-top);
  }
  .view { padding: 14px 16px 24px; max-width: 720px; margin: 0 auto; }

  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 8px 4px 18px;
    gap: 12px;
  }
  .topbar .eyebrow {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-3);
    font-weight: 600;
  }
  .topbar h1 { margin-top: 4px; }
  .topbar .actions { display: flex; gap: 8px; align-self: center; }

  .card {
    background: var(--paper);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--line);
  }
  .card + .card { margin-top: 10px; }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
    gap: 8px;
  }
  .card-header h3 { margin: 0; }
  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-3);
    font-weight: 700;
    margin: 18px 4px 8px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--cream-2);
    color: var(--ink-2);
    font-size: 11px;
    font-weight: 600;
  }
  .pill.turmeric { background: rgba(217,119,6,0.12); color: var(--turmeric-deep); }
  .pill.coriander { background: rgba(101,128,63,0.14); color: var(--coriander-deep); }

  .meta { color: var(--ink-3); font-size: 13px; }
  .num {
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 96;
    font-weight: 600;
    font-feature-settings: 'tnum';
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    font-weight: 600;
    font-size: 14px;
    transition: transform 0.08s, background 0.15s;
    min-height: 40px;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--ink); color: var(--cream); }
  .btn-primary:hover { background: #000; }
  .btn-secondary { background: var(--cream-2); color: var(--ink); }
  .btn-ghost { background: transparent; color: var(--ink-2); padding: 8px 10px; }
  .btn-danger { background: rgba(185,28,28,0.10); color: var(--danger); }
  .btn-icon {
    width: 36px; height: 36px;
    border-radius: 999px;
    background: var(--cream-2);
    color: var(--ink);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .btn-block { width: 100%; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

  .field { display: block; margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-3);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--paper);
    color: var(--ink);
    font-size: 15px;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none;
    border-color: var(--turmeric);
    box-shadow: 0 0 0 3px rgba(217,119,6,0.18);
  }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  .tabbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: var(--tabbar-h);
    padding: 6px 6px env(safe-area-inset-bottom);
    background: rgba(250,244,232,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    z-index: 50;
  }
  .tabbar button {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    color: var(--ink-3);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    transition: color 0.15s;
  }
  .tabbar button svg { width: 22px; height: 22px; stroke-width: 1.7; }
  .tabbar button.active { color: var(--turmeric); }
  .tabbar button.active svg { stroke-width: 2.2; }

  .sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(26,22,18,0.42);
    z-index: 100;
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.22s;
  }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet {
    background: var(--cream);
    width: 100%;
    max-width: 720px;
    max-height: 92vh;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    padding: 16px 18px calc(20px + env(safe-area-inset-bottom));
    box-shadow: var(--shadow-lg);
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(0.2, 0.85, 0.3, 1);
    overflow-y: auto;
  }
  .sheet-backdrop.open .sheet { transform: translateY(0); }
  .sheet-handle {
    width: 40px; height: 4px;
    background: var(--line);
    border-radius: 999px;
    margin: 0 auto 14px;
  }
  .sheet h2 { margin-bottom: 14px; }

  .progress {
    height: 6px;
    background: var(--cream-2);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 6px;
  }
  .progress > div {
    height: 100%;
    background: var(--coriander);
    border-radius: 999px;
    transition: width 0.3s;
  }
  .progress.over > div { background: var(--paprika); }

  .list-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .list-item:last-child { border-bottom: none; }
  .list-item .grow { flex: 1; min-width: 0; }
  .list-item .title { display: block; font-weight: 600; color: var(--ink); }
  .list-item .sub { display: block; font-size: 13px; color: var(--ink-3); margin-top: 2px; }
  .list-item.bought .title { text-decoration: line-through; color: var(--ink-3); }
  .list-item .right { font-weight: 600; color: var(--ink-2); font-feature-settings: 'tnum'; }

  .check {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--paper);
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .check.on {
    background: var(--coriander);
    border-color: var(--coriander);
    color: white;
  }

  .slot {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    text-align: left;
    width: 100%;
  }
  .slot .time-badge {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--cream-2);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .slot .grow { flex: 1; min-width: 0; }
  .slot .slot-time {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-3);
    font-weight: 600;
  }
  .slot .slot-name {
    font-weight: 600;
    color: var(--ink);
    margin-top: 1px;
  }
  .slot .slot-meta { font-size: 12px; color: var(--ink-3); margin-top: 3px; }
  .slot.empty .slot-name { color: var(--ink-3); font-weight: 500; font-style: italic; }

  .day-chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 16px 16px;
    margin: 0 -16px;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .day-chips::-webkit-scrollbar { display: none; }
  .day-chip {
    flex: 0 0 auto;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--paper);
    border: 1px solid var(--line);
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-2);
    scroll-snap-align: start;
  }
  .day-chip.active {
    background: var(--ink);
    color: var(--cream);
    border-color: var(--ink);
  }

  /* segmented control */
  .segmented {
    display: flex;
    background: var(--cream-2);
    border-radius: 999px;
    padding: 3px;
    margin-bottom: 8px;
  }
  .seg {
    flex: 1;
    padding: 9px 10px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-3);
    transition: all 0.15s;
  }
  .seg.active {
    background: var(--paper);
    color: var(--ink);
    box-shadow: var(--shadow-sm);
  }

  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .stat {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
  }
  .stat .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-3);
    font-weight: 600;
  }
  .stat .value {
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 144;
    font-weight: 600;
    font-size: 26px;
    margin-top: 4px;
    letter-spacing: -0.02em;
    font-feature-settings: 'tnum';
  }
  .stat .delta { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .stat.accent { background: var(--ink); color: var(--cream); border-color: var(--ink); }
  .stat.accent .label { color: rgba(250,244,232,0.7); }

  /* recipes */
  .recipe-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 8px;
    overflow: hidden;
  }
  .recipe-toggle {
    width: 100%;
    padding: 14px 16px;
    text-align: left;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .recipe-toggle h3 { font-size: 16px; }
  .recipe-toggle .chev {
    color: var(--ink-3);
    transition: transform 0.2s;
    font-size: 14px;
  }
  .recipe-card.open .recipe-toggle .chev { transform: rotate(180deg); }
  .recipe-body {
    padding: 0 16px 16px;
    border-top: 1px solid var(--line);
    display: none;
  }
  .recipe-card.open .recipe-body { display: block; }
  .recipe-body ul, .recipe-body ol {
    margin: 8px 0 0;
    padding-left: 22px;
  }
  .recipe-body li { margin-bottom: 6px; }
  .recipe-tip {
    background: rgba(217,119,6,0.08);
    border-left: 3px solid var(--turmeric);
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    color: var(--ink-2);
    margin-top: 14px;
  }

  /* timeline */
  .tl-item {
    display: flex;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    align-items: flex-start;
    width: 100%;
    text-align: left;
  }
  .tl-item:last-child { border-bottom: none; }
  .tl-item .check { margin-top: 2px; }
  .tl-item .grow { flex: 1; min-width: 0; }
  .tl-time {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--turmeric-deep);
    font-weight: 700;
    display: block;
  }
  .tl-action {
    font-weight: 600;
    color: var(--ink);
    margin-top: 2px;
    display: block;
  }
  .tl-item.done .tl-action { text-decoration: line-through; color: var(--ink-3); }
  .tl-why {
    font-size: 12px;
    color: var(--ink-3);
    margin-top: 2px;
    display: block;
  }

  /* empty state */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-3);
  }
  .empty-state .emoji { font-size: 48px; display: block; margin-bottom: 8px; }

  /* toast */
  .toast {
    position: fixed;
    bottom: calc(var(--tabbar-h) + 16px);
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--cream);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: var(--shadow-md);
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s;
    z-index: 200;
    max-width: 80%;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* mini bar chart */
  .bars {
    display: flex;
    gap: 6px;
    align-items: flex-end;
    height: 80px;
    margin-top: 12px;
  }
  .bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .bar-col .bar {
    width: 100%;
    background: var(--turmeric);
    border-radius: 4px 4px 0 0;
    min-height: 2px;
    transition: height 0.3s;
  }
  .bar-col .bar.zero { background: var(--cream-2); }
  .bar-col .bar-label {
    font-size: 10px;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }

  .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
  }

  .hidden { display: none !important; }
  .text-right { text-align: right; }
  .mt-12 { margin-top: 12px; }
  .mt-18 { margin-top: 18px; }
  .flex { display: flex; }
  .between { justify-content: space-between; align-items: center; }

  .tabbar, .slot, .day-chip, .check, .btn, .pill, .seg { user-select: none; }
</style>
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <nav class="tabbar" role="tablist">
    <button data-tab="today" aria-label="Today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
      <span>Today</span>
    </button>
    <button data-tab="plan" aria-label="Plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
      <span>Plan</span>
    </button>
    <button data-tab="prep" aria-label="Prep">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v6"/><path d="M18 2v6"/><path d="M4 8h16l-1.5 11a2 2 0 0 1-2 1.8H7.5a2 2 0 0 1-2-1.8L4 8Z"/></svg>
      <span>Prep</span>
    </button>
    <button data-tab="shop" aria-label="Shop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.5 12h11l2-9H6"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
      <span>Shop</span>
    </button>
    <button data-tab="money" aria-label="Money">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M7 6h10M7 10h10M7 6c2.5 0 4 1.5 4 4M7 14h6l-4 6"/></svg>
      <span>Money</span>
    </button>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop">
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toast" id="toast" role="status"></div>

<script>
'use strict';

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const uid = () => Math.random().toString(36).slice(2, 9);
const todayStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};
const DAYS = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
const DAY_LABELS = { monday: 'Mon', tuesday: 'Tue', wednesday: 'Wed', thursday: 'Thu', friday: 'Fri', saturday: 'Sat', sunday: 'Sun' };
const TIME_LABELS = { breakfast: 'Breakfast', lunch: 'Lunch', snack: 'Snack', dinner: 'Dinner' };
const TIME_EMOJI = { breakfast: '☕', lunch: '🍱', snack: '🥜', dinner: '🍽️' };

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtMoney(n, cur = '₹') {
  if (n == null || isNaN(n)) return `${cur}—`;
  return `${cur}${Math.round(n).toLocaleString('en-IN')}`;
}
function todayDayKey() {
  return DAYS[(new Date().getDay() + 6) % 7];
}

let toastT = null;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 2000);
}

const STORAGE_KEY = 'mealmate.v1';
const CURRENT_VERSION = 2;

function defaultState() {
  // ---- MEALS (with assembly notes) ----
  const m = (id, name, time, kcal, protein, ingredients, notes = '') => ({ id, name, time, kcal, protein, ingredients, notes });

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const obj = JSON.parse(raw);

    // version migration — if older or missing, reset to v2 defaults but preserve expenses + profile tweaks
    if (!obj.version || obj.version < CURRENT_VERSION) {
      const fresh = defaultState();
      if (Array.isArray(obj.expenses)) fresh.expenses = obj.expenses;
      if (obj.profile && typeof obj.profile === 'object') {
        // keep currency, but reset budgets to new defaults (which match new doc)
        if (obj.profile.currency) fresh.profile.currency = obj.profile.currency;
        if (obj.profile.name) fresh.profile.name = obj.profile.name;
      }
      return fresh;
    }
    // ensure all keys exist on current-version data
    const def = defaultState();
    for (const k of Object.keys(def)) if (obj[k] === undefined) obj[k] = def[k];
    for (const k of Object.keys(def.profile)) if (obj.profile[k] === undefined) obj.profile[k] = def.profile[k];
    return obj;
  } catch (e) {
    console.error('failed to load state, using defaults', e);
    return defaultState();
  }
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { toast('Storage full or blocked'); console.error(e); }
}

function renderMoney() {
  const view = document.createElement('div');
  view.className = 'view';
  const now = new Date();
  const monthStart = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`;
  const monthExp = state.expenses.filter(e => e.date >= monthStart);
  const monthSpend = monthExp.reduce((s, e) => s + (e.amount || 0), 0);
  const monthPct = state.profile.monthlyBudget ? Math.min(100, (monthSpend / state.profile.monthlyBudget) * 100) : 0;
  const remainingDays = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate() - now.getDate();
  const dailyBudgetLeft = remainingDays > 0 ? (state.profile.monthlyBudget - monthSpend) / remainingDays : 0;

  const byCat = {};
  for (const e of monthExp) byCat[e.category] = (byCat[e.category] || 0) + e.amount;

  const CAT_INFO = {
    groceries:  { label: 'Groceries',  color: 'var(--coriander)' },
    eating_out: { label: 'Eating out', color: 'var(--turmeric)' },
    pantry:     { label: 'Pantry / setup', color: 'var(--cardamom)' },
    other:      { label: 'Other',      color: 'var(--ink-3)' },
  };

  const days7 = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = d.toISOString().slice(0, 10);
    const sum = state.expenses.filter(e => e.date === k).reduce((s, e) => s + e.amount, 0);
    days7.push({ key: k, label: d.toLocaleDateString('en-IN', { weekday: 'short' }).slice(0, 1), sum });
  }
  const max7 = Math.max(1, ...days7.map(d => d.sum));
  const recent = [...state.expenses].sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id)).slice(0, 30);

  view.innerHTML = `
    <header class="topbar">
      <div>
        <div class="eyebrow">${now.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' })}</div>

      </div>
      <div class="actions">

        </button>
      </div>
    </header>

    <section class="card">
      <div class="flex between">
        <div>
          <div class="eyebrow" style="font-size:11px;text-transform:uppercase;letter-spacing:0.12em;color:var(--ink-3);font-weight:600;">This month</div>
          <div class="num" style="font-size:30px;">${fmtMoney(monthSpend, state.profile.currency)}</div>
        </div>
        <div class="text-right">
          <div class="meta">of ${fmtMoney(state.profile.monthlyBudget, state.profile.currency)}</div>
          <div class="meta">≈ ${fmtMoney(dailyBudgetLeft, state.profile.currency)}/day left</div>
        </div>
      </div>
      <div class="progress ${monthSpend > state.profile.monthlyBudget ? 'over' : ''} mt-12"><div style="width:${monthPct}%"></div></div>
    </section>

    <section class="card mt-12">
      <div class="card-header">
        <h3>Last 7 days</h3>
        <span class="meta">${fmtMoney(days7.reduce((s, d) => s + d.sum, 0), state.profile.currency)}</span>
      </div>
      <div class="bars">
        ${days7.map(d => `
          <div class="bar-col" title="${d.key}: ${fmtMoney(d.sum, state.profile.currency)}">
            <div class="bar ${d.sum === 0 ? 'zero' : ''}" style="height:${(d.sum / max7) * 76 + 2}px"></div>
            <span class="bar-label">${d.label}</span>
          </div>
        `).join('')}
      </div>
    </section>

    ${Object.keys(byCat).length ? `
      <section class="card mt-12">
        <div class="card-header"><h3>By category</h3></div>
        ${Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([cat, amt]) => {
          const info = CAT_INFO[cat] || { label: cat, color: 'var(--ink-3)' };
          const pct = monthSpend ? Math.round((amt / monthSpend) * 100) : 0;
          return `<div class="list-item">
            <span class="grow"><span class="title"><span class="dot" style="background:${info.color}"></span>${info.label}</span><span class="sub">${pct}%</span></span>
            <span class="right">${fmtMoney(amt, state.profile.currency)}</span>
          </div>`;
        }).join('')}
      </section>
    ` : ''}

    <h4 class="section-label">Recent</h4>
    <section class="card">
      ${recent.length === 0 ? `<div class="empty-state"><span class="emoji">💸</span>No expenses yet.<br/>Tap + to log one.</div>` : recent.map(e => {
        const info = CAT_INFO[e.category] || { label: e.category };
        const title = e.note ? e.note : info.label;
        const sub = e.note ? `${e.date} · ${info.label}` : e.date;
        return `<div class="list-item expense-row" data-id="${e.id}">
          <span class="grow">
            <span class="title">${escapeHtml(title)}</span>
            <span class="sub">${escapeHtml(sub)}</span>
          </span>
          <span class="right">${fmtMoney(e.amount, state.profile.currency)}</span>
          <button class="btn-ghost row-edit" aria-label="Edit">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
        </div>`;
      }).join('')}
    </section>
  `;
  app.appendChild(view);

  $('#add-expense').addEventListener('click', () => openExpenseSheet());
  $$('.expense-row .row-edit').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    openExpenseSheet(b.closest('.expense-row').dataset.id);
  }));
}

// ===================== SHEETS =====================
function openSheet(html) {
  const sheet = $('#sheet');
  const bd = $('#sheet-backdrop');
  sheet.innerHTML = `<div class="sheet-handle"></div>${html}`;
  bd.classList.add('open');
  document.body.style.overflow = 'hidden';
  sheet.scrollTop = 0;
}
function closeSheet() {
  $('#sheet-backdrop').classList.remove('open');
  document.body.style.overflow = '';
}
$('#sheet-backdrop').addEventListener('click', (e) => {
  if (e.target.id === 'sheet-backdrop') closeSheet();
});

// ---- meal picker ----
function openMealPickerSheet(day, time) {
  const candidates = state.meals.filter(m => m.time === time);
  const currentId = state.plan[day] && state.plan[day][time];
  const html = `
    <h2>${TIME_LABELS[time]} · ${DAY_LABELS[day]}</h2>
    <div class="btn-row" style="margin-bottom:14px;">
      <button class="btn btn-secondary" id="clear-slot">Clear slot</button>
      <button class="btn btn-secondary" id="new-meal-here">+ New meal</button>
    </div>
    <div>
      ${candidates.length === 0 ? '<p class="meta">No meals saved for this time slot. Add one.</p>' : candidates.map(m => `
        <button class="slot meal-pick" data-id="${m.id}" style="margin-bottom:8px;">
          <span class="time-badge">${TIME_EMOJI[time]}</span>
          <span class="grow">
            <span class="slot-name">${escapeHtml(m.name)} ${m.id === currentId ? '✓' : ''}</span>
            <span class="slot-meta">${m.kcal} kcal · ${m.protein}g protein</span>
          </span>
        </button>
      `).join('')}
    </div>
  `;
  openSheet(html);

    state.plan[day][time] = null;
    saveState(); closeSheet(); render();
  });
  $('#new-meal-here').addEventListener('click', () => {
    openMealEditSheet(null, { time, assignTo: { day, time } });

  $$('.meal-pick').forEach(b => b.addEventListener('click', () => {

function openMealEditSheet(id, opts = {}) {
  const m = id ? findMeal(id) : { id: null, name: '', time: opts.time || 'lunch', kcal: 0, protein: 0, ingredients: [], notes: '' };
  const html = `
    <h2>${id ? 'Edit meal' : 'New meal'}</h2>
    <div class="field">
      <label>Name</label>
      <input type="text" id="m-name" value="${escapeHtml(m.name)}" placeholder="e.g. Chicken rice bowl" />
    </div>
    <div class="field">
      <label>Time slot</label>
      <select id="m-time">
        ${['breakfast', 'lunch', 'snack', 'dinner'].map(t => `<option value="${t}" ${m.time === t ? 'selected' : ''}>${TIME_LABELS[t]}</option>`).join('')}
      </select>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Calories</label>
        <input type="number" id="m-kcal" value="${m.kcal || 0}" inputmode="numeric" />
      </div>
      <div class="field">
        <label>Protein (g)</label>
        <input type="number" id="m-prot" value="${m.protein || 0}" inputmode="numeric" />
      </div>
    </div>
    <div class="field">
      <label>Ingredients (one per line)</label>
      <textarea id="m-ing" rows="6">${escapeHtml((m.ingredients || []).join('\n'))}</textarea>
    </div>
    <div class="field">
      <label>How to make it (assembly notes)</label>
      <textarea id="m-notes" rows="5">${escapeHtml(m.notes || '')}</textarea>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="m-save" style="flex:1;">Save</button>
      ${id ? '<button class="btn btn-danger" id="m-del">Delete</button>' : ''}
    </div>
  `;
  openSheet(html);
  $('#m-save').addEventListener('click', () => {
    const name = $('#m-name').value.trim();
    if (!name) { toast('Name is required'); return; }
    const meal = {
      id: m.id || ('m_' + uid()),
      name,
      time: $('#m-time').value,
      kcal: parseInt($('#m-kcal').value, 10) || 0,
      protein: parseInt($('#m-prot').value, 10) || 0,
      ingredients: $('#m-ing').value.split('\n').map(s => s.trim()).filter(Boolean),
      notes: $('#m-notes').value.trim(),
    };
    if (m.id) state.meals[state.meals.findIndex(x => x.id === m.id)] = meal;
    else state.meals.push(meal);
    if (opts.assignTo) {
      const { day, time } = opts.assignTo;
      if (!state.plan[day]) state.plan[day] = {};
      state.plan[day][time] = meal.id;
    }
    saveState(); closeSheet(); toast('Saved'); render();
  });
  if (id) $('#m-del').addEventListener('click', () => {
    if (!confirm(`Delete "${m.name}"?`)) return;
    for (const d of DAYS) for (const t of ['breakfast', 'lunch', 'snack', 'dinner']) {
      if (state.plan[d] && state.plan[d][t] === m.id) state.plan[d][t] = null;
    }
    state.meals = state.meals.filter(x => x.id !== m.id);
    saveState(); closeSheet(); toast('Deleted'); render();
  });
}

// ---- export / import ----
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `mealmate-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Backup downloaded');
}

function importData() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'application/json,.json';
  inp.addEventListener('change', () => {
    const f = inp.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const obj = JSON.parse(reader.result);
        if (!obj || typeof obj !== 'object' || !obj.meals || !obj.plan) throw new Error('Not a MealMate backup');
        if (!confirm('Replace current data with this backup?')) return;
        state = obj;
        saveState(); closeSheet(); render(); toast('Imported');
      } catch (err) {
        alert('Could not import: ' + err.message);
      }
    };
    reader.readAsText(f);
  });
  inp.click();
}

// ---- PWA install ----
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstall = e;
});
window.addEventListener('appinstalled', () => {
  deferredInstall = null;
  toast('Installed — open from your home screen');
});

// ---- service worker ----
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW failed:', err));
  });
}

// ---- boot ----
$$('.tabbar button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
setTab('today');
window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
</script>
</body>
